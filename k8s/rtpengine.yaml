apiVersion: apps/v1
kind: Deployment
metadata:
  name: rtpengine
  namespace: sip
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rtpengine
  template:
    metadata:
      labels:
        app: rtpengine
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet

      nodeSelector:
        kubernetes.io/hostname: ip-192-168-32-28.ap-south-1.compute.internal

      containers:
        - name: rtpengine
          image: readytalk/rtpengine-docker:mr6.2.1.1-39f2f23

          securityContext:
            privileged: true
            capabilities:
              add:
                - NET_ADMIN
                - SYS_ADMIN

          env:
            - name: PRIVATE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP

          command:
            - /bin/sh
          args:
            - -c
            - |

              /usr/sbin/rtpengine \
                --interface=192.168.32.28 \
                --listen-ng=22222 \
                --port-min=10000 \
                --port-max=20000 \
                --log-stderr \
                --foreground
