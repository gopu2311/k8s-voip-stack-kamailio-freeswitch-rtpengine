apiVersion: apps/v1
kind: Deployment
metadata:
  name: rtpengine
  namespace: sip
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rtpengine
  template:
    metadata:
      labels:
        app: rtpengine
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      # Only schedule on nodes labeled for VoIP workloads
      nodeSelector:
        kubernetes.io/hostname: ip-192-168-26-180.ap-south-1.compute.internal
      # Ensure RTPengine and Kamailio run on same node
      affinity:
        podAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - kamailio
                topologyKey: kubernetes.io/hostname
      containers:
        - name: rtpengine
          image: readytalk/rtpengine-docker:mr6.2.1.1-39f2f23
          securityContext:
            privileged: true
            capabilities:
              add:
                - NET_ADMIN
                - SYS_ADMIN
          env:
            - name: PRIVATE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
          command:
            - /bin/sh
          args:
            - -c
            - |
              # Auto-discover node's public IP from AWS metadata service
              # This works on any EKS node without hardcoding
              EXTERNAL_IP=$(curl -s http://ifconfig.me || echo "${PRIVATE_IP}")

              echo "Starting RTPengine with:"
              echo "  Private IP: ${PRIVATE_IP}"
              echo "  Public IP: ${EXTERNAL_IP}"

              # Advertise PUBLIC IP in SDP, bind on PRIVATE IP for RTP
              /usr/sbin/rtpengine \
                --interface=${PRIVATE_IP}!${EXTERNAL_IP} \
                --listen-ng=127.0.0.1:22222 \
                --port-min=10000 \
                --port-max=20000 \
                --log-stderr \
                --foreground
